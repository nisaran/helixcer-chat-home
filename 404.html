<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helixcer Chat</title>
  <link rel="icon" href="/favicon.ico?v=20261111" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20261111">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261111">
  <script>
    (function () {
      var hash = location.hash || "";
      if (/^#(inbox|contacts|settings|campaigns|channels|team|developers|profile|invite)\b/i.test(hash)) {
        location.replace("https://app.chat.helixcer.com/" + hash + location.search);
        return;
      }
      location.replace("/" + location.search + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/">
</head>
<body>
  <p><a href="/">Return to Helixcer Chat</a></p>
</body>
</html>
